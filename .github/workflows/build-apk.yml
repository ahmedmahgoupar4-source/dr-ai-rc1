name: Dr. AI RC-1 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "rc1_upload.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
            - name: Unpack RC-1
        run: unzip -o rc1_upload.zip -d .

      - name: Enable AndroidX
        run: |
          printf '%s\n' 'android.useAndroidX=true' >> gradle.properties
          printf '%s\n' 'android.enableJetifier=true' >> gradle.properties

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dr-ai-rc1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
